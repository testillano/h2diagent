#
# pytest configuration file
#

[pytest]
addopts = -v --junitxml=/tmp/junit.xml -n 0

# log format. See https://docs.python.org/3/library/logging.html#logrecord-attributes
log_format = %(asctime)s|%(name)s|%(filename)s:%(lineno)d|%(levelname)s|%(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_level = DEBUG

junit_suite_name = "H2DIAGENT COMPONENT TEST"
junit_logging = system-out
junit_family = xunit1

# Markers
markers =
 gx: Gx interface (16777238) tests
 functional: functional flows
 server: assertions on the server peer
 client: assertions on the client peer

filterwarnings =
    ignore::DeprecationWarning
