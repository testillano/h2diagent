apiVersion: v1
kind: Service
metadata:
  name: {{ include "h2diagent.name" . }}
  labels:
    {{- include "h2diagent.labels" . | nindent 4 }}
  annotations:
    prometheus.io/path: metrics
    prometheus.io/port: {{ (.Values.h2agent.enabled | ternary .Values.h2agent.prometheusPort .Values.prometheusPort) | quote }}
    prometheus.io/scrape: {{ .Values.metrics.enabled | quote }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # --- h2agent (mock brain) --- only when the sidecar is enabled
    {{- if .Values.h2agent.enabled }}
    - port: {{ .Values.h2agent.adminPort }}
      targetPort: {{ .Values.h2agent.adminPort }}
      protocol: TCP
      name: http2-admin
    - port: {{ .Values.h2agent.trafficPort }}
      targetPort: {{ .Values.h2agent.trafficPort }}
      protocol: TCP
      name: http2-traffic
    - port: {{ .Values.h2agent.prometheusPort }}
      targetPort: {{ .Values.h2agent.prometheusPort }}
      protocol: TCP
      name: http-metrics
    {{- end }}
    # --- h2diagent (gateway) ---
    # HTTP/2 server where an (external) director posts outbound triggers.
    - port: {{ .Values.http2ServerPort }}
      targetPort: {{ .Values.http2ServerPort }}
      protocol: TCP
      name: http2-trigger
    {{- if include "h2diagent.hasServer" . }}
    - port: {{ .Values.diameter.serverPort }}
      targetPort: {{ .Values.diameter.serverPort }}
      protocol: TCP
      name: diameter
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - port: {{ .Values.prometheusPort }}
      targetPort: {{ .Values.prometheusPort }}
      protocol: TCP
      name: gw-metrics
    {{- end }}
  selector:
    {{- include "h2diagent.selectorLabels" . | nindent 4 }}
  publishNotReadyAddresses: true
