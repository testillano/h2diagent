apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "h2diagent.name" . }}
  labels:
    {{- include "h2diagent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "h2diagent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "h2diagent.selectorLabels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      volumes:
        - name: {{ include "h2diagent.name" . }}-dictionaries
          configMap:
            name: {{ include "h2diagent.name" . }}-dictionaries
        {{- if or .Values.diameter.cer .Values.diameter.cea }}
        - name: {{ include "h2diagent.name" . }}-capabilities
          configMap:
            name: {{ include "h2diagent.name" . }}-capabilities
        {{- end }}
        {{- if .Values.utilsMountPath }}
        - name: {{ include "h2diagent.name" . }}-h2diagent-helpers
          configMap:
            name: {{ include "h2diagent.name" . }}-h2diagent-helpers
        {{- end }}
        {{- if and .Values.h2agent.enabled .Values.h2agent.utilsMountPath }}
        - name: {{ include "h2diagent.name" . }}-h2agent-helpers
          configMap:
            name: {{ include "h2diagent.name" . }}-h2agent-helpers
        {{- end }}
      containers:
        # ---------------------------------------------------------------------
        # h2diagent: Diameter <-> HTTP/2 translation gateway
        # ---------------------------------------------------------------------
        - name: {{ include "h2diagent.name" . }}-h2diagent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: {{ include "h2diagent.name" . }}-dictionaries
              mountPath: /opt/stacks
            {{- if or .Values.diameter.cer .Values.diameter.cea }}
            - name: {{ include "h2diagent.name" . }}-capabilities
              mountPath: /opt/capabilities
            {{- end }}
            {{- if .Values.utilsMountPath }}
            - name: {{ include "h2diagent.name" . }}-h2diagent-helpers
              mountPath: {{ .Values.utilsMountPath }}
            {{- end }}
          # h2diagent connects to its dependencies once at startup and does not
          # currently reconnect. To make startup deterministic in Kubernetes
          # (pod/container ordering is not guaranteed), wait for the companion
          # h2agent "brain" (if any) and (for a client) the remote Diameter peer
          # to be listening before exec'ing the gateway. Uses bash /dev/tcp (no nc).
          command:
            - /bin/bash
            - -c
            - |
              wait_tcp() {
                host="$1"; port="$2"; echo "[wait] $host:$port ..."
                i=0
                while [ $i -lt 180 ]; do
                  if (exec 3<>/dev/tcp/$host/$port) 2>/dev/null; then
                    echo "[wait] $host:$port is up"; return 0
                  fi
                  i=$((i + 1)); sleep 1
                done
                echo "[wait] timeout waiting for $host:$port" >&2; return 1
              }
              {{- $brainHost := include "h2diagent.brainHost" . }}
              {{- if $brainHost }}
              wait_tcp {{ $brainHost | quote }} {{ include "h2diagent.brainPort" . }} || exit 1
              {{- end }}
              {{- /* a TCP probe cannot reach an SCTP peer (nor a list): the gateway reconnects anyway */}}
              {{- if and (or (eq .Values.role "client") (eq .Values.role "both")) (ne .Values.diameter.peerHost "") (eq .Values.diameter.clientTransport "tcp") }}
              wait_tcp {{ .Values.diameter.peerHost | quote }} {{ .Values.diameter.peerPort }} || exit 1
              {{- end }}
              echo "[wait] dependencies ready; starting h2diagent"
              exec /bin/h2diagent "$@"
            - h2diagent
          args:
            - "--diameter-port"
            {{- if include "h2diagent.hasServer" . }}
            - {{ .Values.diameter.serverPort | quote }}
            {{- else }}
            - "0"
            {{- end }}
            {{- if and (or (eq .Values.role "client") (eq .Values.role "both")) (ne .Values.diameter.peerHost "") }}
            - "--diameter-peer-host"
            - {{ .Values.diameter.peerHost | quote }}
            - "--diameter-peer-port"
            - {{ .Values.diameter.peerPort | quote }}
            - "--diameter-connections"
            - {{ .Values.diameter.connections | quote }}
            {{- end }}
            - "--origin-host"
            - {{ .Values.originHost | quote }}
            - "--origin-realm"
            - {{ .Values.originRealm | quote }}
            - "--product-name"
            - {{ .Values.productName | quote }}
            {{- range .Values.stacks }}
            - "--dictionary"
            - "/opt/stacks/{{ . }}.json"
            {{- end }}
            - "--watchdog-interval"
            - {{ .Values.diameter.watchdogInterval | quote }}
            - "--diameter-timeout-ms"
            - {{ .Values.diameter.timeoutMs | quote }}
            - "--diameter-server-transport"
            - {{ .Values.diameter.serverTransport | quote }}
            - "--diameter-client-transport"
            - {{ .Values.diameter.clientTransport | quote }}
            {{- if include "h2diagent.hasServer" . }}
            - "--diameter-server-local-host"
            - {{ .Values.diameter.serverLocalHost | default "0.0.0.0" | quote }}
            {{- end }}
            {{- if .Values.diameter.clientLocalHost }}
            - "--diameter-client-local-host"
            - {{ .Values.diameter.clientLocalHost | quote }}
            {{- end }}
            {{- with .Values.diameter.sctp }}
            {{- if .heartbeatIntervalMs }}
            - "--sctp-heartbeat-interval-ms"
            - {{ .heartbeatIntervalMs | quote }}
            {{- end }}
            {{- if .pathMaxRetrans }}
            - "--sctp-path-max-retrans"
            - {{ .pathMaxRetrans | quote }}
            {{- end }}
            {{- if .primaryPeerAddress }}
            - "--sctp-primary-peer-address"
            - {{ .primaryPeerAddress | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.diameter.cer }}
            - "--cer"
            - "/opt/capabilities/cer.json"
            {{- end }}
            {{- if .Values.diameter.cea }}
            - "--cea"
            - "/opt/capabilities/cea.json"
            {{- end }}
            {{- range $avp, $form := .Values.diameter.decodeAs }}
            - "--decode-as"
            - {{ printf "%s=%s" $avp $form | quote }}
            {{- end }}
            {{- $brainHost := include "h2diagent.brainHost" . }}
            {{- if $brainHost }}
            - "--h2agent-host"
            - {{ $brainHost | quote }}
            - "--h2agent-port"
            - {{ include "h2diagent.brainPort" . | quote }}
            - "--h2agent-connections"
            - {{ .Values.h2agent.connections | default 4 | quote }}
            {{- end }}
            - "--http2-server-port"
            - {{ .Values.http2ServerPort | quote }}
            {{- if gt (int .Values.http2ServerThreads) 0 }}
            - "--http2-server-threads"
            - {{ .Values.http2ServerThreads | quote }}
            {{- end }}
            - "--admin-port"
            - {{ .Values.adminPort | quote }}
            {{- if .Values.metrics.enabled }}
            - "--prometheus-port"
            - {{ .Values.prometheusPort | quote }}
            {{- else }}
            - "--disable-metrics"
            {{- end }}
            - "--log-level"
            - {{ .Values.logLevel | quote }}
            {{- if .Values.verbose }}
            - "--verbose"
            {{- end }}
          # Probes: the admin health (HTTP/2 prior knowledge, so an exec curl), or a
          # TCP check on the HTTP/2 server port when the admin interface is disabled.
          readinessProbe:
            {{- if gt (int .Values.adminPort) 0 }}
            exec:
              command: ["curl", "-sf", "--http2-prior-knowledge", "http://localhost:{{ .Values.adminPort }}/admin/v1/health"]
            {{- else }}
            tcpSocket:
              port: {{ .Values.http2ServerPort }}
            {{- end }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            {{- if gt (int .Values.adminPort) 0 }}
            exec:
              command: ["curl", "-sf", "--http2-prior-knowledge", "http://localhost:{{ .Values.adminPort }}/admin/v1/health"]
            {{- else }}
            tcpSocket:
              port: {{ .Values.http2ServerPort }}
            {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- if .Values.utilsMountPath }}
          # Source the h2diagent helpers into interactive shells (kubectl exec).
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - echo "source '{{ .Values.utilsMountPath }}/helpers.bash'" >> ~/.bashrc
          {{- end }}
        # ---------------------------------------------------------------------
        # h2agent sidecar: HTTP/2 mock brain (reached over localhost).
        # Only present when h2agent.enabled=true (the Diameter SERVER / mock-brain
        # case). By default the gateway is a pure translator and this container is
        # absent.
        # ---------------------------------------------------------------------
        {{- if .Values.h2agent.enabled }}
        - name: {{ include "h2diagent.name" . }}-h2agent
          image: "{{ .Values.h2agent.image.repository }}:{{ .Values.h2agent.image.tag }}"
          imagePullPolicy: {{ .Values.h2agent.image.pullPolicy }}
          {{- if .Values.h2agent.utilsMountPath }}
          volumeMounts:
            - name: {{ include "h2diagent.name" . }}-h2agent-helpers
              mountPath: {{ .Values.h2agent.utilsMountPath }}
          {{- end }}
          args:
            - "--log-level"
            - {{ .Values.h2agent.logLevel | quote }}
            {{- if .Values.h2agent.verbose }}
            - "--verbose"
            {{- end }}
            - "--admin-port"
            - {{ .Values.h2agent.adminPort | quote }}
            - "--traffic-server-port"
            - {{ .Values.h2agent.trafficPort | quote }}
            - "--prometheus-port"
            - {{ .Values.h2agent.prometheusPort | quote }}
          readinessProbe:
            exec:
              command:
                - curl
                - -sf
                - --http2-prior-knowledge
                - http://localhost:{{ .Values.h2agent.adminPort }}/admin/v2/health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - curl
                - -sf
                - --http2-prior-knowledge
                - http://localhost:{{ .Values.h2agent.adminPort }}/admin/v2/health
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- if .Values.h2agent.utilsMountPath }}
          # Source the h2agent helpers into interactive shells (kubectl exec),
          # mirroring the default h2agent chart.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - echo "source '{{ .Values.h2agent.utilsMountPath }}/helpers.bash'" >> ~/.bashrc
          {{- end }}
        {{- end }}
