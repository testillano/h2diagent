# Default values for the h2diagent chart.
#
# h2diagent is a PURE Diameter <-> HTTP/2 TRANSLATOR. By default it is deployed
# as a single container: it has no embedded "programming engine" (no provisioning
# brain). That engine lives in a separate h2agent, and whether an h2agent needs to
# accompany the gateway depends on the role the gateway plays:
#
#   * Diameter SERVER (PCRF-like): on inbound Diameter the gateway must DECIDE the
#     answer, so it needs a "brain". That brain is an h2agent acting as a MOCK,
#     reached over localhost -> co-locating it as a sidecar in THIS pod is natural
#     and is the only case that justifies the companion container
#     (set h2agent.enabled=true).
#
#   * Diameter CLIENT / pure translator: the gateway only forwards an external
#     director's HTTP/2 into outbound Diameter and relays the real answer back.
#     There is NO inbound to answer, so NO companion h2agent is needed here. The
#     flow is driven by a DIRECTOR (an h2agent in CLIENT role) that coordinates
#     HYBRID flows (HTTP/2 steps that never touch the gateway, plus Diameter steps
#     that do). Because the director's scope exceeds the gateway, its natural home
#     is an EXTERNAL pod, NOT a sidecar of this chart.
#
# Hence the default below is h2agent.enabled=false (pure translator). Enable it
# only for the server/PCRF (mock-brain) case. See README for the full rationale.
#
# A peer plays a Diameter "role":
#   server -> h2diagent listens for inbound Diameter (diameter.serverPort)
#   client -> h2diagent dials a remote peer (diameter.peerHost:peerPort)
#   both   -> listens and dials
#
# Ports are identical across peers on purpose: each peer is its own pod/Service,
# so there are no collisions and the CT can address them by Service DNS name.

replicaCount: 1

# Set by the wrapper chart (ct-h2diagent) to "server"/"client" so that the two
# subchart instances get distinct resource names.
nameOverride: ""

# Diameter role: server | client | both
role: server

# Diameter identity (advertised in CER).
originHost: h2diagent.example.com
originRealm: example.com
productName: h2diagent

# Diameter stacks (dictionaries). Each name must have a matching
# dictionaries/<name>.json file bundled in the chart (mounted at /opt/stacks).
stacks:
  - gx

diameter:
  # Inbound listener port (server/both). 0 disables the listener (pure client).
  serverPort: 3868
  # Outbound peer (client/both). peerHost is typically the "server" Service name.
  peerHost: ""
  peerPort: 3868
  watchdogInterval: 30
  timeoutMs: 5000
  # tcp | sctp  (sctp is single-homing; CT uses tcp)
  serverTransport: tcp
  clientTransport: tcp

# HTTP/2 server where the h2agent sidecar posts outbound triggers.
# Kept away from h2agent.prometheusPort (8080) to avoid in-pod collision.
http2ServerPort: 8081

logLevel: Warning
verbose: true

image:
  repository: ghcr.io/testillano/h2diagent
  tag: latest
  pullPolicy: IfNotPresent

prometheusPort: 8085
metrics:
  enabled: true

# Mount h2diagent's own helpers (tools/helpers.bash) into the h2diagent
# container and source them on start (into ~/.bashrc). h2diagent has no admin
# REST API, so these are metric shortcuts (metrics, metrics_summary) over the
# Prometheus endpoint. Set to "" to disable.
utilsMountPath: /opt/utils

# Companion h2agent "brain".
#
# enabled=false (default): pure translator, single-container gateway. No sidecar.
#   - If 'host' below is set, the gateway dials that EXTERNAL h2agent (another
#     pod) as its brain; if left empty, the gateway runs without a brain
#     (fine for a pure Diameter CLIENT / translator, which has no inbound to
#     answer).
# enabled=true: run the h2agent as a SIDECAR in this pod (the mock-brain case for
#   a Diameter SERVER). The gateway dials it over localhost.
h2agent:
  enabled: false
  # Host/port the gateway dials for its brain.
  #   - sidecar mode (enabled=true): forced to localhost:trafficPort.
  #   - external mode (enabled=false + host set): a Service DNS name of an
  #     h2agent living in another pod.
  #   - no brain (enabled=false + host empty): --h2agent-host is not passed.
  host: ""
  port: 8000
  image:
    repository: ghcr.io/testillano/h2agent
    tag: latest
    pullPolicy: IfNotPresent
  adminPort: 8074
  trafficPort: 8000
  prometheusPort: 8080
  logLevel: Warning
  verbose: true
  # Mount the h2agent troubleshooting helpers (helpers.bash) and source them on
  # container start (into ~/.bashrc), mirroring the default h2agent chart. Set
  # to "" to disable. The functions come from native-helpers.bash, bundled by
  # ct/test.sh from the h2agent tools; if absent, only the port variables and
  # convenience settings are provided. Only used when enabled=true (sidecar).
  utilsMountPath: /opt/utils

service:
  type: ClusterIP

resources: {}
