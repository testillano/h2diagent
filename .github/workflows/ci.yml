name: CI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker images tag'
        required: true
  push:
    branches:
    - master
    tags:
    - v*.*.*

  pull_request:
    branches:
    - master

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  format_style:
    name: Check source code format
    runs-on: ubuntu-latest
    steps:
    -
      name: Check out the repo
      uses: actions/checkout@v4
    -
      name: Check source code format
      run: |
          sources=$(find . -name "*.hpp" -o -name "*.cpp")
          docker run --rm -v $PWD:/data ghcr.io/testillano/clang-format:latest --dry-run -Werror ${sources}

  # Doxygen html for the GitHub Pages site (doxygen/), formerly served by codedocs.xyz
  doxygen:
    uses: testillano/workflows/.github/workflows/doxygen.yml@v1
    with:
      doxyfile_dir: docs/doxygen
      doxyfile_overrides: |
        PROJECT_NUMBER=${{ github.ref_name }}

  build_and_push_docker_images_as_local:
    needs: format_style
    name: Build and push docker images as local
    runs-on: ubuntu-latest
    steps:
    -
      name: Check out the repo
      uses: actions/checkout@v4
    -
      name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: true
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    -
      name: Build local builder image (deps stage)
      id: docker_build1
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/h2diagent_builder:local
        file: Dockerfile
        target: deps
        context: .
        platforms: linux/amd64
        no-cache: true
        push: true
    -
      name: Build local runtime image
      id: docker_build2
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/h2diagent:local
        file: Dockerfile
        target: runtime
        context: .
        platforms: linux/amd64
        push: true
    -
      # Same build as the runtime image above (build stage from the cache), so
      # its debug info matches the cores of the runtime binary (build-id)
      name: Build local runtime debug image (runtime + debug info + gdb)
      id: docker_build2_debug
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/h2diagent:local-debug
        file: Dockerfile
        target: runtime-debug
        context: .
        platforms: linux/amd64
        push: true
    -
      name: Build local ct image
      id: docker_build3
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/ct-h2diagent:local
        file: ct/Dockerfile
        context: ct
        platforms: linux/amd64
        push: true

  push_docker_images_as_latest:
    needs: build_and_push_docker_images_as_local
    name: Push docker images as latest
    runs-on: ubuntu-latest
    steps:
    -
      name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: true
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    -
      name: Push images
      run: |
        image_tag=${{ github.event.inputs.tag }}
        [ -z "${image_tag}" ] && image_tag=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
        [[ "${{ github.ref }}" == "refs/tags/"* ]] && image_tag=$(echo $image_tag | sed -e 's/^v//')
        [ "$image_tag" == "master" ] && image_tag=latest

        echo "image_tag=$image_tag"

        for imgbn in h2diagent_builder h2diagent ct-h2diagent
        do
          echo "Creating tag ${image_tag} for ${imgbn} in ghcr.io"
          docker buildx imagetools create -t ghcr.io/testillano/${imgbn}:${image_tag} ghcr.io/testillano/${imgbn}:local
        done

        echo "Creating tag ${image_tag}-debug for h2diagent in ghcr.io"
        docker buildx imagetools create -t ghcr.io/testillano/h2diagent:${image_tag}-debug ghcr.io/testillano/h2diagent:local-debug

  # Deploy the Pages site in a dedicated job on a clean runner: actions/deploy-pages@v4
  # requires the 'github-pages' environment to be declared on the job.
  deploy_pages:
    needs: doxygen
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    # Do not fail the whole pipeline if Pages hiccups:
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    -
      name: Setup Pages
      uses: actions/configure-pages@v3
    -
      name: Download doxygen html
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.doxygen.outputs.artifact_name }}
        path: site/doxygen
    -
      name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site
    -
      name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
