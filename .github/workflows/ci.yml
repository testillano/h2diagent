name: CI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker images tag'
        required: true
      hversion:
        description: 'Helm charts version (empty: the Chart.yaml one)'
        required: false
  push:
    branches:
    - master
    tags:
    - v*.*.*

  pull_request:
    branches:
    - master

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  format_style:
    name: Check source code format
    runs-on: ubuntu-latest
    steps:
    -
      name: Check out the repo
      uses: actions/checkout@v4
    -
      name: Check source code format
      run: |
          sources=$(find . -name "*.hpp" -o -name "*.cpp")
          docker run --rm -v $PWD:/data ghcr.io/testillano/clang-format:latest --dry-run -Werror ${sources}

  # Doxygen html for the GitHub Pages site (doxygen/), formerly served by codedocs.xyz
  doxygen:
    uses: testillano/workflows/.github/workflows/doxygen.yml@v1
    with:
      doxyfile_dir: docs/doxygen
      doxyfile_overrides: |
        PROJECT_NUMBER=${{ github.ref_name }}

  # Unit test coverage for the GitHub Pages site (coverage/, badge.json): a Debug
  # build (--coverage, cmake/compiler_flags.cmake) run in its own container.
  build_coverage:
    needs: format_style
    name: Build coverage image
    runs-on: ubuntu-latest
    steps:
    -
      name: Check out the repo
      uses: actions/checkout@v4
    -
      name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: true
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    -
      name: Build coverage image (debug build stage)
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/h2diagent:latest-cov
        file: Dockerfile
        target: build
        build-args: build_type=Debug
        context: .
        platforms: linux/amd64
        push: true

  unit_tests_and_coverage:
    needs: build_coverage
    name: Run unit tests and build the coverage report
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/testillano/h2diagent:latest-cov
      options: "--entrypoint sh"
    steps:
    -
      name: Install coverage tools
      run: apt-get update && apt-get install -y lcov bc
    -
      name: Run unit tests and generate coverage
      run: |
        cd /code
        CAPTURE_OPTS="--ignore-errors empty --ignore-errors inconsistent --ignore-errors mismatch"
        lcov --capture --directory ./src --directory ./ut --initial --output-file base-coverage.info ${CAPTURE_OPTS}
        ./build/Debug/bin/unit-test
        lcov --capture --directory ./src --directory ./ut --output-file test-coverage.info --ignore-errors gcov,gcov ${CAPTURE_OPTS}
        lcov -a base-coverage.info -a test-coverage.info -o total-coverage.info
        lcov --extract total-coverage.info "/code/src/*" "/code/include/*" --output-file extracted-coverage.info
        lcov --remove extracted-coverage.info "*/main.cpp" --output-file final-coverage.info --ignore-errors unused
        genhtml final-coverage.info --output-directory /code/coverage
        cp final-coverage.info /code/coverage/lcov.info
    -
      name: Create badge json file
      run: |
        value=$(grep -oP 'headerCovTableEntry(Hi|Med|Lo)">[0-9]+\.[0-9]+' /code/coverage/index.html | grep -oP '[0-9]+\.[0-9]+' | head -n 1)
        if [ "$(echo "${value} < 50" | bc -l)" = "1" ]; then
          color="red"
        elif [ "$(echo "${value} < 80" | bc -l)" = "1" ]; then
          color="orange"
        else
          color="brightgreen"
        fi
        echo '{"schemaVersion":1,"label":"coverage","message":"'${value}'%","color":"'${color}'"}' > /code/coverage/badge.json
    -
      name: Upload coverage html
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: /code/coverage

  build_and_push_docker_images_as_local:
    needs: format_style
    name: Build and push docker images as local
    runs-on: ubuntu-latest
    steps:
    -
      name: Check out the repo
      uses: actions/checkout@v4
    -
      name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: true
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    -
      name: Build local builder image (deps stage)
      id: docker_build1
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/h2diagent_builder:local
        file: Dockerfile
        target: deps
        context: .
        platforms: linux/amd64
        no-cache: true
        push: true
    -
      name: Build local runtime image
      id: docker_build2
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/h2diagent:local
        file: Dockerfile
        target: runtime
        context: .
        platforms: linux/amd64
        push: true
    -
      # Same build as the runtime image above (build stage from the cache), so
      # its debug info matches the cores of the runtime binary (build-id)
      name: Build local runtime debug image (runtime + debug info + gdb)
      id: docker_build2_debug
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/h2diagent:local-debug
        file: Dockerfile
        target: runtime-debug
        context: .
        platforms: linux/amd64
        push: true
    -
      name: Build local ct image
      id: docker_build3
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/ct-h2diagent:local
        file: ct/Dockerfile
        context: ct
        platforms: linux/amd64
        push: true

  push_docker_images_as_latest:
    needs: build_and_push_docker_images_as_local
    name: Push docker images as latest
    runs-on: ubuntu-latest
    steps:
    -
      name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: true
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    -
      name: Push images
      run: |
        image_tag=${{ github.event.inputs.tag }}
        [ -z "${image_tag}" ] && image_tag=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
        [[ "${{ github.ref }}" == "refs/tags/"* ]] && image_tag=$(echo $image_tag | sed -e 's/^v//')
        [ "$image_tag" == "master" ] && image_tag=latest

        echo "image_tag=$image_tag"

        for imgbn in h2diagent_builder h2diagent ct-h2diagent
        do
          echo "Creating tag ${image_tag} for ${imgbn} in ghcr.io"
          docker buildx imagetools create -t ghcr.io/testillano/${imgbn}:${image_tag} ghcr.io/testillano/${imgbn}:local
        done

        echo "Creating tag ${image_tag}-debug for h2diagent in ghcr.io"
        docker buildx imagetools create -t ghcr.io/testillano/h2diagent:${image_tag}-debug ghcr.io/testillano/h2diagent:local-debug

  # Deploy the Pages site in a dedicated job on a clean runner: actions/deploy-pages@v4
  # requires the 'github-pages' environment to be declared on the job.
  deploy_pages:
    needs: [doxygen, unit_tests_and_coverage]
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    # Only the master branch deploys: the 'github-pages' environment protection
    # rejects tags and pull requests, and every rejected run leaves a failed
    # deployment (shown by the Pages badge).
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    # Do not fail the whole pipeline if Pages hiccups:
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    -
      # First: checkout cleans the workspace, so it must precede the downloads
      name: Check out the repo
      uses: actions/checkout@v4
    -
      name: Setup Pages
      uses: actions/configure-pages@v3
    -
      name: Download doxygen html
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.doxygen.outputs.artifact_name }}
        path: site/doxygen
    -
      name: Download coverage html
      uses: actions/download-artifact@v4
      with:
        name: coverage-html
        path: site/coverage
    -
      name: Assemble GitHub Pages site
      run: |
        cp docs/site/index.html site/index.html
        cp -r docs/api site/api
    -
      name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site
    -
      name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # Helm charts (h2diagent, ct-h2diagent) published to the testillano/helm
  # repository (gh-pages, https://testillano.github.io/helm, alias erthelm), as
  # h2agent does. The secret PERSONAL_ACCESS_TOKEN_REPO_FULL must give write
  # access to testillano/helm.
  helm_publish:
    needs: push_docker_images_as_latest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    -
      # What ct/test.sh bundles before packaging: the stack dictionaries (the
      # chart ConfigMap globs dictionaries/*.json) and the h2agent helpers for
      # the sidecar (optional: without them the sidecar gets the port variables)
      name: Bundle dictionaries and helpers into the chart
      run: |
        cp tools/stacks/*.json helm/h2diagent/dictionaries/
        curl -sfL https://raw.githubusercontent.com/testillano/h2agent/master/tools/helpers.bash \
          -o helm/h2diagent/helpers/native-helpers.bash || echo "h2agent helpers not bundled"
        ls -l helm/h2diagent/dictionaries helm/h2diagent/helpers
    -
      name: Publish Helm charts
      uses: stefanprodan/helm-gh-pages@master
      with:
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN_REPO_FULL }}
        charts_dir: helm
        repository: helm
        branch: gh-pages
        chart_version: ${{ github.event.inputs.hversion }}
