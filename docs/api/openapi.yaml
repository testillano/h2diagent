openapi: 3.1.0
info:
  title: h2diagent Admin API
  description: |
    Admin interface of the h2diagent Diameter <-> HTTP/2 gateway: health, the
    Diameter connections, the running configuration and the log level. All
    operations are served under the `/admin/v1/` base path on the admin port
    (`--admin-port`, default 8079; `0` disables it), over HTTP/2 (prior
    knowledge: `curl --http2-prior-knowledge`).

    The interface is **not authenticated**: keep it inside the test namespace.
  version: "1.0"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: h2diagent
    url: https://github.com/testillano/h2diagent

servers:
  - url: http://localhost:8079
    description: Default admin endpoint

tags:
  - name: health
    description: Process health (the chart probes)
  - name: peers
    description: Diameter connections
  - name: configuration
    description: Running configuration
  - name: logging
    description: Log level

paths:
  /admin/v1/health:
    get:
      tags: [health]
      summary: Health
      description: Answers 200 while the process serves.
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy]
                required: [status]
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /admin/v1/peers:
    get:
      tags: [peers]
      summary: Diameter connections
      description: >
        Every Diameter connection: the client pool (`--diameter-connections`,
        leg `client`, pool position as index) and the peers connected to the
        listener (leg `server`). A client connection which is not connected
        shows the configured peer address and no peer identity; a server peer
        which closes leaves the list.
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connection'
                required: [connections]
              example:
                connections:
                  - leg: client
                    index: 0
                    transport: tcp
                    state: open
                    localAddress: 10.0.0.5:41022
                    peerAddress: 10.0.0.7:3868
                    peerOriginHost: server.example.com
                    peerOriginRealm: example.com
                  - leg: server
                    index: 0
                    transport: tcp
                    state: open
                    localAddress: 10.0.0.5:3868
                    peerAddress: 10.0.0.9:50114
                    peerOriginHost: client.example.com
                    peerOriginRealm: example.com
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /admin/v1/peers/{leg}/{index}:
    put:
      tags: [peers]
      summary: Base protocol fault injection on a connection
      description: >
        Give exactly one of `watchdog` or `action`. `watchdog=mute` stops answering
        the DWRs and sending them (`answer` restores). `action=close` closes
        abruptly (a client connection reconnects with its backoff); `action=dpr`
        disconnects orderly (a client connection does not reconnect until
        `action=connect`, client connections only).
      parameters:
        - name: leg
          in: path
          required: true
          schema:
            type: string
            enum: [client, server]
        - name: index
          in: path
          required: true
          description: As listed by GET peers
          schema:
            type: integer
            minimum: 0
        - name: watchdog
          in: query
          schema:
            type: string
            enum: [mute, answer]
        - name: action
          in: query
          schema:
            type: string
            enum: [close, dpr, connect]
        - name: cause
          in: query
          description: Disconnect-Cause of a dpr
          schema:
            type: string
            enum: [REBOOTING, BUSY, DO_NOT_WANT_TO_TALK_TO_YOU]
            default: REBOOTING
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '404':
          description: No such connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /admin/v1/configuration:
    put:
      tags: [configuration]
      summary: Set the CEA Result-Code (fault injection)
      description: >
        Result-Code of the CEA answered to the peers connecting from now on
        (server leg): 2001 accepts, another code rejects the capabilities
        exchange and closes, `none` answers no CEA. The connected peers are not
        affected.
      parameters:
        - name: ceaResultCode
          in: query
          required: true
          schema:
            type: string
            example: "5010"
            description: 1000..5999 or none
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          description: Invalid value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '404':
          description: No Diameter server leg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
    get:
      tags: [configuration]
      summary: Running configuration
      description: >
        Ports, Diameter identity, dictionaries (file and application id),
        timeouts, transports, TLS enabled or not (never keys nor passwords),
        `--decode-as`, metrics.
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /admin/v1/logging:
    get:
      tags: [logging]
      summary: Current log level
      responses:
        '200':
          description: Log level
          content:
            text/plain:
              schema:
                type: string
                example: Warning
    put:
      tags: [logging]
      summary: Set the log level
      parameters:
        - name: level
          in: query
          required: true
          schema:
            type: string
            enum: [Debug, Informational, Notice, Warning, Error, Critical, Alert, Emergency]
      responses:
        '200':
          description: Level set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          description: Missing or unknown level (the current one is kept)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

components:
  responses:
    MethodNotAllowed:
      description: Method not allowed on the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultResponse'

  schemas:
    ResultResponse:
      type: object
      description: Any other path under the admin port answers 404 with this document.
      properties:
        result:
          type: string
          enum: ["true", "false"]
        response:
          type: string
      required: [result, response]

    Connection:
      type: object
      properties:
        leg:
          type: string
          enum: [client, server]
          description: client = opened by the gateway (pool); server = accepted by its listener
        index:
          type: integer
          minimum: 0
          description: Client pool position, or listing position on the server leg
        transport:
          type: string
          enum: [tcp, sctp]
        state:
          type: string
          enum: [closed, reconnecting, waitCEA, waitCER, open, closing]
          description: >
            reconnecting = a client connection lost with its reconnection armed;
            waitCEA / waitCER = capabilities exchange; closing = DPR sent.
        localAddress:
          type: string
          description: <address>:<port> (absent when not connected)
        peerAddress:
          type: string
          description: <address>:<port> (a client connection not connected shows the configured peer)
        peerOriginHost:
          type: string
          description: Origin-Host of the peer (absent until the capabilities exchange)
        peerOriginRealm:
          type: string
        watchdog:
          type: string
          enum: [answer, mute]
          description: Watchdog of the connection (mute = fault injection)
        paths:
          type: array
          description: SCTP only (multihoming) - peer addresses with their state
          items:
            type: object
            properties:
              address:
                type: string
              state:
                type: string
                enum: [active, inactive, potentiallyFailed, unconfirmed, unknown]
              primary:
                type: boolean
        localAddresses:
          type: array
          description: SCTP only - local addresses of the association
          items:
            type: string
      required: [leg, index, transport, state]

    CapabilitiesAvps:
      type: object
      description: Extra CER (client leg) / CEA (server leg) AVPs, present with --cer / --cea
      properties:
        file:
          type: string
        avps:
          type: object
          description: As given (AVP name -> value, gateway mapping)

    Configuration:
      type: object
      properties:
        diameter:
          type: object
          properties:
            serverPort:
              type: integer
              description: Listener port (0 = no listener)
            serverLocalHost:
              type: string
              description: Listener address(es), a comma separated list for an SCTP multihomed listener
            sctp:
              type: object
              description: Present when a leg is SCTP (path supervision options; 0 / "" = kernel defaults)
              properties:
                heartbeatIntervalMs:
                  type: integer
                pathMaxRetrans:
                  type: integer
                primaryPeerAddress:
                  type: string
            serverTransport:
              type: string
              enum: [tcp, sctp]
            serverTls:
              type: boolean
            originHost:
              type: string
            originRealm:
              type: string
            productName:
              type: string
            watchdogIntervalSec:
              type: integer
            timeoutMs:
              type: integer
            ceaResultCode:
              description: CEA Result-Code answered (server leg), or "none"
              oneOf:
                - type: integer
                - type: string
                  enum: [none]
            dictionaries:
              type: array
              items:
                type: object
                properties:
                  file:
                    type: string
                  applicationId:
                    type: integer
            decodeAs:
              type: object
              additionalProperties:
                type: string
              description: AVP name -> readable form
            cer:
              $ref: '#/components/schemas/CapabilitiesAvps'
            cea:
              $ref: '#/components/schemas/CapabilitiesAvps'
            peer:
              type: object
              description: Present when the gateway dials a peer (client leg)
              properties:
                host:
                  type: string
                port:
                  type: integer
                transport:
                  type: string
                  enum: [tcp, sctp]
                connections:
                  type: integer
                localHost:
                  type: string
                  description: Local source address, or "auto"
                tls:
                  type: boolean
        h2agent:
          type: object
          properties:
            host:
              type: string
            port:
              type: integer
        http2ServerPort:
          type: integer
        adminPort:
          type: integer
        metrics:
          type: object
          properties:
            enabled:
              type: boolean
            prometheusPort:
              type: integer
            additionalLabels:
              type: array
              items:
                type: string
        workers:
          type: integer
          description: Worker threads (0 = nproc)
